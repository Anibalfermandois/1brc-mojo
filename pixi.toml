[workspace]
name = "1brc"
version = "0.1.0"
description = "1 Billion Row Challenge in Mojo"
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
mojo = "*"
modular = ">=26.5.0.dev2026073014,<27"

[tasks]
build = { cmd = "entrypoints/build.sh", description = "Build perf_bin with -O3" }
check = { cmd = "entrypoints/check.sh", description = "Verify mmap and streaming against the Python oracle" }
bench = { cmd = "entrypoints/bench.sh", description = "Run 11-sample normal-use benchmark" }
bench-100m = { cmd = "entrypoints/bench.sh measurements_100m.txt 11", description = "Bench 100m file, 11 runs" }
bench-300m = { cmd = "entrypoints/bench.sh measurements_300m.txt 11", description = "Bench 300m file, 11 runs" }
bench-600m = { cmd = "entrypoints/bench.sh measurements_600m.txt 11", description = "Bench 600m file, 11 runs" }
bench-1b = { cmd = "entrypoints/bench.sh measurements_1b.txt 11", description = "Bench 1b file, 11 runs" }
analyze = { cmd = "entrypoints/analyze.sh", description = "Deep analysis (collisions & metrics)" }
gpu-scan = { cmd = "entrypoints/gpu-scan.sh", description = "Run resident-data GPU scan and temperature parsing gates" }
